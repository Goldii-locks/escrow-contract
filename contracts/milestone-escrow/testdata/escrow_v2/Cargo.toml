[package]
name = "escrow-v2"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
milestone-escrow = { path = "../.." }
soroban-sdk = "28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Standalone: not a member of the repository workspace.
[workspace]
