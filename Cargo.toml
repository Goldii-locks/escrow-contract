[workspace]
resolver = "2"
members = ["contracts/milestone-escrow", "contracts/escrow-factory"]

[workspace.dependencies]
soroban-sdk = { version = "29.0.1" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
