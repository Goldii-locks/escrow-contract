[workspace]
resolver = "2"
members = [
    "contracts/milestone-escrow",
    "contracts/escrow-factory",
    "contracts/escrow-types",
]

[workspace.dependencies]
soroban-sdk = { version = "28.0.0" }
escrow-types = { version = "0.1.0", path = "contracts/escrow-types" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
