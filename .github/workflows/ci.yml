name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default: read-only token for every job. Widened per-job where needed.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        # Pinned to match rust-toolchain.toml. stellar-cli rejects 1.81, 1.82,
        # 1.83 and 1.91.0 outright, so this cannot float on @stable.
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # toolchain version set via `with:`
        with:
          toolchain: "1.96.0"
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Install stellar-cli
        # soroban-sdk 28 refuses to build under a bare `cargo build` and
        # requires stellar-cli v25.2.0+. The action installs a prebuilt binary;
        # pin to a commit SHA so a retagged release cannot change CI output.
        uses: stellar/stellar-cli@f2a7b74175c34585f3b30a1abf42a2d41cbcc390 # v30.0.1
        with:
          # A SHA ref carries no version, so name the release to download.
          version: "30.0.1"

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check for orphaned test snapshots
        run: python3 scripts/check-orphan-snapshots.py

      - name: Check for orphaned test modules
        run: python3 scripts/check-orphan-test-modules.py

      - name: Format check
        run: cargo fmt --manifest-path contracts/milestone-escrow/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path contracts/milestone-escrow/Cargo.toml --all-targets -- -D warnings

      - name: Main entry-point resource costs
        run: cargo test --manifest-path contracts/milestone-escrow/Cargo.toml cost_tests::main_entrypoint_cost_baselines -- --nocapture

      - name: Run tests
        run: cargo test --manifest-path contracts/milestone-escrow/Cargo.toml

      - name: Golden snapshots unchanged
        # golden_snapshot_tests rewrites contracts/milestone-escrow/golden_snapshots/
        # on every run. A diff means a flow now stores or emits something
        # different: if that is intended, rerun the tests locally and commit
        # the updated files with the change.
        run: |
          git add -N contracts/milestone-escrow/golden_snapshots
          git diff --exit-code --stat -- contracts/milestone-escrow/golden_snapshots
      - name: Build and optimize WASM
        # `--optimize` runs wasm-opt on the release build; that is the wasm
        # which gets deployed, so it is the one measured below.
        run: stellar contract build --manifest-path contracts/milestone-escrow/Cargo.toml --optimize --out-dir dist/optimized

      - name: WASM size budget
        # Fails when the optimized wasm outgrows WASM_BUDGET_BYTES, so size
        # creep is caught in the PR that causes it. The budget is a measured
        # size plus 5%. Raise it deliberately, in a PR that explains the growth.
        # 191,229 bytes when this landed with #852: since the original 170,237
        # measurement, main gained the arbiter fee, dispute evidence, milestone
        # amendment, freelancer rotation, event topics, the constructor
        # settings, tax recipients and contract-assigned admin proposals.
        # 203,184 bytes with #858: migrate (#853), replace_arbiter (#856) and
        # the narrower admin roles (#858).
        # Note: testnet and mainnet cap contract code at 131,072 bytes
        # (contract_max_size_bytes), which this wasm already exceeds; this
        # budget only stops further growth.
        env:
          WASM_BUDGET_BYTES: "213343"
        run: |
          wasm=dist/optimized/milestone_escrow.wasm
          size=$(stat -c %s "$wasm")
          sha=$(sha256sum "$wasm" | cut -d' ' -f1)
          echo "milestone_escrow.wasm: $size bytes (budget $WASM_BUDGET_BYTES), sha256 $sha"
          {
            echo "### Optimized milestone_escrow.wasm"
            echo ""
            echo "| size (bytes) | budget (bytes) | sha256 |"
            echo "|---|---|---|"
            echo "| $size | $WASM_BUDGET_BYTES | \`$sha\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$WASM_BUDGET_BYTES" ]; then
            echo "::error::milestone_escrow.wasm is $size bytes, over the $WASM_BUDGET_BYTES-byte budget"
            exit 1
          fi

      - name: Upload optimized wasm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: milestone_escrow-optimized-${{ github.sha }}
          path: dist/optimized/milestone_escrow.wasm

      # The factory's tests deploy the escrow wasm built just above.
      - name: Format check (factory)
        run: cargo fmt --manifest-path contracts/escrow-factory/Cargo.toml --check

      - name: Clippy (factory)
        run: cargo clippy --manifest-path contracts/escrow-factory/Cargo.toml --all-targets -- -D warnings

      - name: Run factory tests
        run: cargo test --manifest-path contracts/escrow-factory/Cargo.toml

      - name: Build factory WASM
        run: stellar contract build --manifest-path contracts/escrow-factory/Cargo.toml

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # toolchain version set via `with:`
        with:
          toolchain: nightly

      - name: Install cargo-llvm-cov
        run: |
          rustup component add llvm-tools-preview --toolchain nightly
          cargo +nightly install cargo-llvm-cov --locked

      - name: Measure contract coverage
        # 96.63% line coverage was measured on this revision; keep 1 percentage point of headroom.
        run: cargo +nightly llvm-cov --manifest-path contracts/milestone-escrow/Cargo.toml --branch --fail-under-lines 95.63 --lcov --output-path coverage.lcov

      - name: Write coverage summary
        run: |
          python3 - coverage.lcov <<'PY'
          import sys

          files = {}
          current = None
          with open(sys.argv[1], encoding="utf-8") as report:
              for line in report:
                  line = line.rstrip()
                  if line.startswith("SF:"):
                      current = files.setdefault(line[3:], {"lines": [], "branches": []})
                  elif line == "end_of_record":
                      current = None
                  elif current is not None and line.startswith("DA:"):
                      _, count = line[3:].split(",")
                      current["lines"].append(int(count) > 0)
                  elif current is not None and line.startswith("BRDA:"):
                      taken = line.rsplit(",", 1)[1]
                      current["branches"].append(taken != "-" and int(taken) > 0)

          def totals(entries, key):
              values = [covered for entry in entries for covered in entry[key]]
              return sum(values), len(values)

          def percentage(covered, found):
              return f"{100 * covered / found:.2f}%" if found else "n/a"

          summary = []
          selected = [
              (path, data)
              for path, data in files.items()
              if path.endswith("/src/lib.rs") or path.endswith("/src/math.rs")
          ]
          if {path.rsplit("/", 1)[1] for path, _ in selected} != {"lib.rs", "math.rs"}:
              raise SystemExit("coverage report is missing lib.rs or math.rs")

          summary.extend([
              "### Contract test coverage",
              "",
              "| File | Lines | Branches |",
              "|---|---:|---:|",
          ])
          for path, data in sorted(selected):
              line_covered, line_total = totals([data], "lines")
              branch_covered, branch_total = totals([data], "branches")
              summary.append(
                  f"| `{path.rsplit('/', 1)[1]}` | "
                  f"{line_covered}/{line_total} ({percentage(line_covered, line_total)}) | "
                  f"{branch_covered}/{branch_total} ({percentage(branch_covered, branch_total)}) |"
              )

          line_covered, line_total = totals([data for _, data in files.items()], "lines")
          branch_covered, branch_total = totals([data for _, data in files.items()], "branches")
          summary.append(
              f"| **Total** | {line_covered}/{line_total} ({percentage(line_covered, line_total)}) | "
              f"{branch_covered}/{branch_total} ({percentage(branch_covered, branch_total)}) |"
          )
          with open(sys.argv[1].replace(".lcov", ".summary.md"), "w", encoding="utf-8") as output:
              output.write("\n".join(summary) + "\n")
          PY
          cat coverage.summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload LCOV report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: milestone-escrow-coverage-${{ github.sha }}
          path: coverage.lcov

  dependencies:
    # RUSTSEC advisories (vulnerable, unsound, unmaintained), yanked crates,
    # disallowed licenses and unknown sources in Cargo.lock fail CI. Policy
    # and accepted exceptions live in deny.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check
          arguments: --all-features

  typescript-bindings:
    # Issue #744: clients hand-encode ScVals today (backend build-tx mapper,
    # frontend initialize call) and their decoding of get_job /
    # get_whitelisted_tokens is broken precisely because nothing pins the
    # contract's types. Generate TypeScript bindings from the built wasm for
    # every main build and publish them as a versioned GitHub Package on
    # release, so client repos can switch to a typed client instead of
    # spelling out { type: "u64", value } by hand.
    # The bindings carry no contract id; consumers pass the deployed escrow's
    # id when instantiating the client (see docs/typescript-bindings.md).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        # Pinned to match rust-toolchain.toml; see the note in the test job.
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # toolchain version set via `with:`
        with:
          toolchain: "1.96.0"
          targets: wasm32v1-none

      - name: Install stellar-cli
        uses: stellar/stellar-cli@f2a7b74175c34585f3b30a1abf42a2d41cbcc390 # v30.0.1
        with:
          # A SHA ref carries no version, so name the release to download.
          version: "30.0.1"

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build WASM
        run: stellar contract build --manifest-path contracts/milestone-escrow/Cargo.toml

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Generate TypeScript bindings
        # The bindings carry no contract id: consumers pass the deployed
        # escrow's id when they create the client (docs/typescript-bindings.md).
        run: |
          set -euo pipefail
          stellar contract bindings typescript \
            --wasm target/wasm32v1-none/release/milestone_escrow.wasm \
            --output-dir bindings/ts \
            --overwrite
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-main.${GITHUB_RUN_NUMBER}"
          fi
          cd bindings/ts
          npm pkg set name=@goldii-locks/milestone-escrow-bindings version="$VERSION"
          npm install
          npm run build
          {
            echo "### TypeScript bindings"
            echo
            echo "- package version: \`$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bindings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: milestone-escrow-bindings-ts-${{ github.sha }}
          path: |
            bindings/ts/
            !bindings/ts/node_modules/

  publish-bindings:
    # On a v* tag, publish the bindings built above as a versioned package in
    # GitHub Packages so client repos can depend on it (issue #744).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: typescript-bindings
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: milestone-escrow-bindings-ts-${{ github.sha }}
          path: bindings/ts

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@goldii-locks'

      - name: Publish
        working-directory: bindings/ts
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reproducible-wasm:
    # Builds the release wasm in the pinned container (issue #773) and publishes
    # it with its SHA-256 for every commit, so a deployed contract's wasm hash
    # can be traced back to the commit that produced it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Reproducible build
        run: bash scripts/build-reproducible.sh "$GITHUB_SHA"

      - name: Publish hash
        run: |
          {
            echo "### milestone_escrow.wasm"
            echo
            echo "| commit | sha256 |"
            echo "|---|---|"
            echo "| \`$GITHUB_SHA\` | \`$(cut -d' ' -f1 dist/milestone_escrow.wasm.sha256)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat dist/build-info.json

      - name: Upload wasm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: milestone_escrow-wasm-${{ github.sha }}
          path: dist/
