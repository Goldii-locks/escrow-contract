name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        # Pinned to match rust-toolchain.toml. stellar-cli rejects 1.81, 1.82,
        # 1.83 and 1.91.0 outright, so this cannot float on @stable.
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Install stellar-cli
        # soroban-sdk 28 refuses to build under a bare `cargo build` and
        # requires stellar-cli v25.2.0+. The action installs a prebuilt binary;
        # the version comes from the ref, so bump the tag to change it.
        uses: stellar/stellar-cli@v28.0.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check for orphaned test snapshots
        run: python3 scripts/check-orphan-snapshots.py

      - name: Check for orphaned test modules
        run: python3 scripts/check-orphan-test-modules.py

      - name: Format check
        run: cargo fmt --manifest-path contracts/milestone-escrow/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path contracts/milestone-escrow/Cargo.toml --all-targets -- -D warnings

      - name: Main entry-point resource costs
        run: cargo test --manifest-path contracts/milestone-escrow/Cargo.toml cost_tests::main_entrypoint_cost_baselines -- --nocapture

      - name: Run tests
        run: cargo test --manifest-path contracts/milestone-escrow/Cargo.toml

      - name: Build and optimize WASM
        # `--optimize` runs wasm-opt on the release build; that is the wasm
        # which gets deployed, so it is the one measured below.
        run: stellar contract build --manifest-path contracts/milestone-escrow/Cargo.toml --optimize --out-dir dist/optimized

      - name: WASM size budget
        # Fails when the optimized wasm outgrows WASM_BUDGET_BYTES, so size
        # creep is caught in the PR that causes it. The budget is a measured
        # size plus 5%. Raise it deliberately, in a PR that explains the growth.
        # 191,229 bytes when this landed with #852: since the original 170,237
        # measurement, main gained the arbiter fee, dispute evidence, milestone
        # amendment, freelancer rotation, event topics, the constructor
        # settings, tax recipients and contract-assigned admin proposals.
        env:
          WASM_BUDGET_BYTES: "200790"
        run: |
          wasm=dist/optimized/milestone_escrow.wasm
          size=$(stat -c %s "$wasm")
          sha=$(sha256sum "$wasm" | cut -d' ' -f1)
          echo "milestone_escrow.wasm: $size bytes (budget $WASM_BUDGET_BYTES), sha256 $sha"
          {
            echo "### Optimized milestone_escrow.wasm"
            echo ""
            echo "| size (bytes) | budget (bytes) | sha256 |"
            echo "|---|---|---|"
            echo "| $size | $WASM_BUDGET_BYTES | \`$sha\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$WASM_BUDGET_BYTES" ]; then
            echo "::error::milestone_escrow.wasm is $size bytes, over the $WASM_BUDGET_BYTES-byte budget"
            exit 1
          fi

      - name: Upload optimized wasm
        uses: actions/upload-artifact@v4
        with:
          name: milestone_escrow-optimized-${{ github.sha }}
          path: dist/optimized/milestone_escrow.wasm

      # The factory's tests deploy the escrow wasm built just above.
      - name: Format check (factory)
        run: cargo fmt --manifest-path contracts/escrow-factory/Cargo.toml --check

      - name: Clippy (factory)
        run: cargo clippy --manifest-path contracts/escrow-factory/Cargo.toml --all-targets -- -D warnings

      - name: Run factory tests
        run: cargo test --manifest-path contracts/escrow-factory/Cargo.toml

      - name: Build factory WASM
        run: stellar contract build --manifest-path contracts/escrow-factory/Cargo.toml

  dependencies:
    # RUSTSEC advisories (vulnerable, unsound, unmaintained), yanked crates,
    # disallowed licenses and unknown sources in Cargo.lock fail CI. Policy
    # and accepted exceptions live in deny.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  typescript-bindings:
    # Issue #744: clients hand-encode ScVals today (backend build-tx mapper,
    # frontend initialize call) and their decoding of get_job /
    # get_whitelisted_tokens is broken precisely because nothing pins the
    # contract's types. Generate TypeScript bindings from the built wasm for
    # every main build and publish them as a versioned GitHub Package on
    # release, so client repos can switch to a typed client instead of
    # spelling out { type: "u64", value } by hand.
    # The bindings carry no contract id; consumers pass the deployed escrow's
    # id when instantiating the client (see docs/typescript-bindings.md).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        # Pinned to match rust-toolchain.toml; see the note in the test job.
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32v1-none

      - name: Install stellar-cli
        uses: stellar/stellar-cli@v28.0.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build WASM
        run: stellar contract build --manifest-path contracts/milestone-escrow/Cargo.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate TypeScript bindings
        # The bindings carry no contract id: consumers pass the deployed
        # escrow's id when they create the client (docs/typescript-bindings.md).
        run: |
          set -euo pipefail
          stellar contract bindings typescript \
            --wasm target/wasm32v1-none/release/milestone_escrow.wasm \
            --output-dir bindings/ts \
            --overwrite
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-main.${GITHUB_RUN_NUMBER}"
          fi
          cd bindings/ts
          npm pkg set name=@goldii-locks/milestone-escrow-bindings version="$VERSION"
          npm install
          npm run build
          {
            echo "### TypeScript bindings"
            echo
            echo "- package version: \`$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bindings
        uses: actions/upload-artifact@v4
        with:
          name: milestone-escrow-bindings-ts-${{ github.sha }}
          path: |
            bindings/ts/
            !bindings/ts/node_modules/

  publish-bindings:
    # On a v* tag, publish the bindings built above as a versioned package in
    # GitHub Packages so client repos can depend on it (issue #744).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: typescript-bindings
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: milestone-escrow-bindings-ts-${{ github.sha }}
          path: bindings/ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@goldii-locks'

      - name: Publish
        working-directory: bindings/ts
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reproducible-wasm:
    # Builds the release wasm in the pinned container (issue #773) and publishes
    # it with its SHA-256 for every commit, so a deployed contract's wasm hash
    # can be traced back to the commit that produced it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reproducible build
        run: bash scripts/build-reproducible.sh "$GITHUB_SHA"

      - name: Publish hash
        run: |
          {
            echo "### milestone_escrow.wasm"
            echo
            echo "| commit | sha256 |"
            echo "|---|---|"
            echo "| \`$GITHUB_SHA\` | \`$(cut -d' ' -f1 dist/milestone_escrow.wasm.sha256)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat dist/build-info.json

      - name: Upload wasm
        uses: actions/upload-artifact@v4
        with:
          name: milestone_escrow-wasm-${{ github.sha }}
          path: dist/
