name: Advisories

# RUSTSEC advisories are published against crates that are already locked, so
# the `dependencies` job in ci.yml only catches them on the next push. This
# re-checks Cargo.lock weekly and opens (or comments on) a tracking issue when
# it fails, so the result does not sit unseen in the Actions tab (#1013).

on:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: cargo-deny advisories
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check advisories

      - name: Open or update tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Scheduled cargo-deny advisories check failed"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The scheduled \`cargo-deny check advisories\` run failed: $RUN_URL"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi
