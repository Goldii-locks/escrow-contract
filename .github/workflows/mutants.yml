name: Mutants

on:
  workflow_dispatch:
  schedule:
    # Nightly at 04:00 UTC, after the E2E run.
    - cron: "0 4 * * *"

# Read-only token: this workflow only builds and uploads artifacts.
permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # toolchain version set via `with:`
        with:
          toolchain: "1.96.0"
          targets: wasm32v1-none

      - name: Install stellar-cli
        uses: stellar/stellar-cli@f2a7b74175c34585f3b30a1abf42a2d41cbcc390 # v30.0.1
        with:
          # A SHA ref carries no version, so name the release to download.
          version: "30.0.1"

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-mutants-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Mutants in math.rs
        # Split, rounding and weight-allocation code (issue #1022). Every
        # mutant should be caught; a missed one fails this step and is listed
        # in mutants-math/mutants.out/missed.txt.
        run: >
          cargo mutants --package milestone-escrow
          --file contracts/milestone-escrow/src/math.rs
          --output mutants-math

      - name: Mutants in the settlement helpers
        # pay_or_credit, outstanding_escrow_obligations and arbiter_fee_for in
        # lib.rs decide who is paid, what is owed and what may be swept.
        if: ${{ !cancelled() }}
        run: >
          cargo mutants --package milestone-escrow
          --file contracts/milestone-escrow/src/lib.rs
          --re 'pay_or_credit|outstanding_escrow_obligations|arbiter_fee_for'
          --output mutants-settlement

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutants
          path: |
            mutants-math/mutants.out
            mutants-settlement/mutants.out
