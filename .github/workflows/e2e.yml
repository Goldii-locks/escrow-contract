name: E2E

on:
  workflow_dispatch:
  schedule:
    # Nightly at 03:00 UTC.
    - cron: "0 3 * * *"

# Default: read-only token for every job.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # toolchain version set via `with:`
        with:
          toolchain: "1.96.0"
          targets: wasm32v1-none

      - name: Install stellar-cli
        uses: stellar/stellar-cli@f2a7b74175c34585f3b30a1abf42a2d41cbcc390 # v30.0.1
        with:
          # A SHA ref carries no version, so name the release to download.
          version: "30.0.1"

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-e2e-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run local-network end-to-end test
        run: bash scripts/e2e.sh
        env:
          KEEP_NETWORK: "1"
