name: E2E

on:
  workflow_dispatch:
  schedule:
    # Nightly at 03:00 UTC.
    - cron: "0 3 * * *"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: wasm32v1-none

      - name: Install stellar-cli
        uses: stellar/stellar-cli@v28.0.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-e2e-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run local-network end-to-end test
        run: bash scripts/e2e.sh
        env:
          KEEP_NETWORK: "1"
